name: CI Performance Regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'services/**'

jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test --silent
      - name: Instrumentation checks
        run: node scripts/check-instrumentation.js



